unresolved:
  - core:scripts/ci/check_independent_validation_gate.py
  - Sealed holdout validation and Linux/Windows packaging are hosted proof lanes; local focused tests do not establish those results.
  - The audit reconstruction reader has no CLI entry point; the deferral is recorded in docs/OPERATION_HISTORY.md.
  - Action List and PageMaster rollback surfaces are deferred; the deferral is recorded in docs/GOVERNED_EXECUTION.md.
  - The cross-surface fixture is bound through governed-execution lane paths, UnitTestsProductOperatorLoop, and check_governed_parity.py; it is not registered in fixtures.yaml.
  - PageMaster publishes a derived source-identity digest and its own resolved-profile digest; the parity test binds the shared fixture through its manifest document identity.
  - The existing source-integrity second-store guard does not detect a differently named store.
