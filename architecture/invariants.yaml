format_version: 1
kind: invariants
description: Machine-checked architecture invariants. Numbered product invariants remain in docs/architecture-invariants.json and the generated catalog.
source_catalog: docs/architecture-invariants.json
checks:
  - id: forbidden-dependencies
    enforcement: enforced
    summary: Product layers must not link or include Widgets, and core must not link presentation or tool layers.
  - id: dependency-direction
    enforcement: enforced
    summary: Each product target may link only the libraries named on its layer.
  - id: storage-boundaries
    enforcement: enforced
    summary: Interaction, the Quick document model, and the preflight engine do not open settings, SQL, or the network.
  - id: deterministic-core
    enforcement: enforced
    summary: LoopLibCore does not include QtNetwork. Clock and RNG calls outside the parser remain a harness TODO.
    todo: Narrow QDateTime and QRandomGenerator bans to the parser and writer once those call sites are classified.
  - id: model-network-isolation
    enforcement: enforced
    summary: The document model does not include preflight, PageMaster, or QtNetwork.
  - id: public-api-ownership
    enforcement: enforced
    summary: PageMaster, the document model, and preflight each have one listed home. Duplicate homes fail.
  - id: d1-canonical-json-bytes
    enforcement: declared
    summary: Identity-bearing digests use pdf::canonicalJson with RFC 8785 key order and documented Qt Compact exceptions.
    todo: Proven by UnitTestsGovernedExecution golden vectors and docs/CANONICAL_JSON.md. TODO add a static include/call-site checker.
  - id: d2-preview-non-publishing
    enforcement: declared
    summary: Technical and visual previews never publish; only publishGovernedArtifact writes approved destination bytes.
    todo: Proven by UnitTestsGovernedExecution preview/publish negatives. TODO add a call-graph guard.
  - id: d3-destination-not-in-plan-digest
    enforcement: declared
    summary: Operation plan digests exclude destination path; destination and overwrite policy bind at execution.
    todo: Proven by UnitTestsGovernedExecution destination binding cases. TODO assert plan envelope keys statically.
  - id: d4-publication-vs-durable-completion
    enforcement: declared
    summary: Published destination bytes and durable sign-off/provenance completion are separate recoverable states.
    todo: Proven by UnitTestsGovernedExecution publish-without-sign-off. TODO model states in a schema.
  - id: d5-cross-surface-identity-equality
    enforcement: declared
    summary: Cross-surface equality is plan and governed output identity under pinned inputs, not raw PDF writer bytes.
    todo: "Proven by check_governed_parity and ADR-011 issue 656 disposition. TODO bind named cross-surface fixtures in CI."
reusable_for:
  - product: ivory
    maps_to: Snapshot immutability and semantic dependency rules use boundaries plus invariants, with different layer ids.
  - product: revenger
    maps_to: Architecture and ISA invariants use the invariants document and proof-lanes, with different check ids.
