name: Documentation truth

on:
  push:
    branches:
      - stable
      - dev
  pull_request:
    branches:
      - stable
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Verify ADR metadata and generated catalogs
        run: python3 scripts/generate-architecture-catalogs.py --check
      - name: Verify generated agent policy adapters
        run: python3 scripts/agent/generate-adapters.py
      - name: Test agent policy helpers
        run: python3 -m unittest discover -s scripts/agent -p 'test_*.py'
