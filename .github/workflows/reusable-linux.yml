name: Reusable Linux CI

on:
  workflow_call:
    inputs:
      fast:
        required: false
        type: boolean
        default: false
      base_sha:
        required: false
        type: string
        default: ''
      head_sha:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/loupe/vcpkg/overlays/linux:${{ github.workspace }}/loupe/vcpkg/overlays/general
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      QT_QPA_PLATFORM: offscreen
      SENTRY_DSN: off

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: loupe
          fetch-depth: 0

      - name: Verify supply-chain pins
        working-directory: loupe
        run: python3 scripts/ci/check_supply_chain_pins.py

      - name: Verify Loupe shell contract
        working-directory: loupe
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-loupe-shell-contract.ps1
      - name: Verify Quick shell admission policy
        working-directory: loupe
        run: python3 scripts/verify-quick-shell-policy.py
      - name: Verify branch policy
        working-directory: loupe
        run: python3 scripts/ci/check_branch_policy.py
      - name: Verify version policy
        working-directory: loupe
        run: python3 scripts/ci/check_version_policy.py

      - name: Prepare vcpkg directories
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y libcups2 libcups2-dev libfontconfig1-dev

      - name: Verify runner packaging versions
        run: |
          # The ubuntu-24.04 runner label is pinned at the job level; assert the
          # dpkg version it ships matches the recorded pin (packaging-tools.json
          # -> deb) so a runner image drift fails loudly.
          DEB_PIN="$(python3 - <<'PY'
          import json
          with open("loupe/.github/pins/packaging-tools.json", encoding="utf-8") as f:
              print(json.load(f)["deb"]["dpkgVersion"])
          PY
          )"
          ACTUAL="$(dpkg-query -W -f='${Version}' dpkg)"
          test "$ACTUAL" = "$DEB_PIN" || {
              echo "::error::dpkg version drift: expected $DEB_PIN, runner has $ACTUAL"
              exit 1
          }

      - name: 'VCPKG: Set up VCPKG'
        run: |
          VCPKG_COMMIT="$(python3 - <<'PY'
          import json
          with open("loupe/vcpkg-configuration.json", encoding="utf-8") as f:
              print(json.load(f)["default-registry"]["baseline"])
          PY
          )"

          if ! [[ "$VCPKG_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid vcpkg baseline: $VCPKG_COMMIT"
              exit 1
          fi

          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout --detach "$VCPKG_COMMIT"

          ACTUAL="$(git -C vcpkg rev-parse HEAD)"
          test "$ACTUAL" = "$VCPKG_COMMIT" || {
              echo "::error::vcpkg checkout does not match manifest baseline"
              exit 1
          }

          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg integrate install

      - name: 'VCPKG: Cache vcpkg dependencies'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ./vcpkg/downloads
            ./vcpkg/packages
            ./vcpkg_installed
          key: ${{ runner.os }}-vcpkg-v2-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v2-

      - name: 'VCPKG: Install project dependencies'
        run: |
          ./vcpkg install --x-manifest-root=$GITHUB_WORKSPACE/loupe --x-install-root=$VCPKG_INSTALLED_DIR --clean-buildtrees-after-build --clean-packages-after-build
        working-directory: vcpkg

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: '6.11.1'
          host: 'linux'
          target: 'desktop'
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          modules: 'qtspeech qtmultimedia'
          cache: 'true'
          cache-key-prefix: ${{ runner.os }}-qt-6111

      - name: Build project
        working-directory: loupe
        run: |
          cmake -B build -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DLOUPE_BUILD_QUICK_SHELL_SMOKE=ON -DLOUPE_INSTALL_QT_DEPENDENCIES=0 -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_VCPKG_BUILD_TYPE=Release
          if [ "${{ inputs.fast }}" != "true" ]; then
            cmake --build build --target all release_translations --config Release -j6
            cmake --install build
          fi

      - name: Smoke Qt Quick preferred backend
        if: ${{ !inputs.fast }}
        working-directory: loupe
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: opengl
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-quick-backend-smoke.ps1 -BuildDir ./build -Mode native -ExpectedGraphicsApi opengl

      - name: Smoke Qt Quick software backend
        if: ${{ !inputs.fast }}
        working-directory: loupe
        env:
          QT_QPA_PLATFORM: offscreen
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-quick-backend-smoke.ps1 -BuildDir ./build -Mode software -ExpectedGraphicsApi software

      - name: Prove change with agent-fast
        if: inputs.fast
        working-directory: loupe
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/agent/check-change.py --base "$BASE_SHA" --head "$HEAD_SHA" --report agent-fast-evidence.json
          else
            python3 scripts/agent/check-change.py --base "$BASE_SHA" --head "$HEAD_SHA" --report agent-fast-evidence.json --skip-changelog
          fi

      - name: Test agent policy checker
        if: inputs.fast
        working-directory: loupe
        run: python3 -m unittest scripts.agent.test_check_change -v

      - name: Upload agent-fast evidence
        if: inputs.fast
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: agent-fast-evidence
          path: loupe/agent-fast-evidence.json
          if-no-files-found: error

      - name: Verify developer product surface
        if: ${{ !inputs.fast }}
        working-directory: loupe
        run: pwsh ./scripts/verify-loupe-surface.ps1 -InstallDir "$GITHUB_WORKSPACE/loupe/build/install" -Profile developer

      - name: Run unit tests
        if: ${{ !inputs.fast }}
        working-directory: loupe/build
        run: |
          ctest --output-on-failure

      - name: Run preflight corpus gate
        if: ${{ !inputs.fast }}
        working-directory: loupe/build
        run: |
          ctest -R UnitTestsPreflightCorpus --output-on-failure

      - name: Make DEB package
        if: ${{ !inputs.fast && github.event_name != 'pull_request' }}
        working-directory: loupe/build
        run: |
          sh make-package.sh

      - name: Upload DEB package
        if: ${{ !inputs.fast }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ubuntu-deb-package
          path: ./loupe/build/*.deb
          retention-days: 30
