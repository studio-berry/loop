name: Reusable Linux CI

on:
  workflow_call:
    inputs:
      fast:
        required: false
        type: boolean
        default: false
      base_sha:
        required: false
        type: string
        default: ''
      head_sha:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/loop/vcpkg/overlays/linux:${{ github.workspace }}/loop/vcpkg/overlays/general
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      QT_QPA_PLATFORM: offscreen
      SENTRY_DSN: off

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: loop
          fetch-depth: 0

      - name: Verify supply-chain pins
        working-directory: loop
        run: python3 scripts/ci/check_supply_chain_pins.py

      - name: Verify Loop shell contract
        working-directory: loop
        run: |
          python3 scripts/verify-loop-shell-contract.py
      - name: Verify plugin and legacy form accounting
        working-directory: loop
        run: python3 scripts/verify-plugin-form-accounting.py
      - name: Verify Widgets library consumer graph
        working-directory: loop
        run: python3 scripts/verify-widgets-library-consumer-graph.py
      - name: Verify installed product graph
        working-directory: loop
        run: python3 scripts/verify-installed-product-graph.py
      - name: Verify Widgets-free release profile
        working-directory: loop
        run: python3 scripts/verify-widgets-free-release-profile.py
      - name: Verify interaction boundary
        working-directory: loop
        run: python3 scripts/verify-interaction-boundary.py
      - name: Verify command catalog
        working-directory: loop
        run: python3 scripts/verify-command-catalog.py
      - name: Verify Quick shell admission policy
        working-directory: loop
        run: python3 scripts/verify-quick-shell-policy.py
      - name: Verify Quick runtime/package contract
        working-directory: loop
        run: python3 scripts/verify-quick-runtime-contract.py
      - name: Verify branch policy
        working-directory: loop
        run: python3 scripts/ci/check_branch_policy.py
      - name: Verify version policy
        working-directory: loop
        run: python3 scripts/ci/check_version_policy.py
      - name: Verify processing-budget exhaustion corpus
        working-directory: loupe
        run: python3 scripts/budget_exhaustion/generate_corpus.py --check

      - name: Prepare vcpkg directories
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y libcups2 libcups2-dev libfontconfig1-dev

      - name: Verify runner packaging versions
        run: |
          # The ubuntu-24.04 runner label is pinned at the job level; assert the
          # dpkg version it ships matches the recorded pin (packaging-tools.json
          # -> deb) so a runner image drift fails loudly.
          DEB_PIN="$(python3 - <<'PY'
          import json
          with open("loop/.github/pins/packaging-tools.json", encoding="utf-8") as f:
              print(json.load(f)["deb"]["dpkgVersion"])
          PY
          )"
          ACTUAL="$(dpkg-query -W -f='${Version}' dpkg)"
          test "$ACTUAL" = "$DEB_PIN" || {
              echo "::error::dpkg version drift: expected $DEB_PIN, runner has $ACTUAL"
              exit 1
          }

      - name: 'VCPKG: Set up VCPKG'
        run: |
          VCPKG_COMMIT="$(python3 - <<'PY'
          import json
          with open("loop/vcpkg-configuration.json", encoding="utf-8") as f:
              print(json.load(f)["default-registry"]["baseline"])
          PY
          )"

          if ! [[ "$VCPKG_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid vcpkg baseline: $VCPKG_COMMIT"
              exit 1
          fi

          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout --detach "$VCPKG_COMMIT"

          ACTUAL="$(git -C vcpkg rev-parse HEAD)"
          test "$ACTUAL" = "$VCPKG_COMMIT" || {
              echo "::error::vcpkg checkout does not match manifest baseline"
              exit 1
          }

          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg integrate install

      - name: 'VCPKG: Cache vcpkg dependencies'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ./vcpkg/downloads
            ./vcpkg/packages
            ./vcpkg_installed
          key: ${{ runner.os }}-vcpkg-v2-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v2-

      - name: 'VCPKG: Install project dependencies'
        run: |
          ./vcpkg install --x-manifest-root=$GITHUB_WORKSPACE/loop --x-install-root=$VCPKG_INSTALLED_DIR --clean-buildtrees-after-build --clean-packages-after-build
        working-directory: vcpkg

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: '6.11.1'
          host: 'linux'
          target: 'desktop'
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          modules: 'qtspeech qtmultimedia'
          cache: 'true'
          cache-key-prefix: ${{ runner.os }}-qt-6111

      - name: Verify Widgets-free release configure
        working-directory: loop
        run: |
          python3 scripts/verify-widgets-free-release-profile.py --configure \
            --build-dir build-widgets-free-verify -- \
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_VCPKG_BUILD_TYPE=Release \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR"

      - name: Prepare Widgets-absent Qt prefix
        if: ${{ !inputs.fast }}
        working-directory: loop
        run: |
          test -n "${QT_ROOT_DIR:-}" || {
            echo "::error::install-qt-action did not provide QT_ROOT_DIR"
            exit 1
          }
          python3 scripts/ci/prepare_widgets_free_qt.py \
            --source "$QT_ROOT_DIR" \
            --destination "$RUNNER_TEMP/loop-qt-without-widgets" \
            --manifest "$RUNNER_TEMP/loop-widgets-free-qt.json"
          echo "LOOP_WIDGETS_FREE_QT_PREFIX=$RUNNER_TEMP/loop-qt-without-widgets" >> "$GITHUB_ENV"
          echo "LOOP_WIDGETS_FREE_BUILD_DIR=$RUNNER_TEMP/loop-widgets-free-build" >> "$GITHUB_ENV"
          echo "LOOP_WIDGETS_FREE_NEGATIVE_BUILD_DIR=$RUNNER_TEMP/loop-widgets-free-negative" >> "$GITHUB_ENV"

      - name: Verify Widgets-absent release configure
        if: ${{ !inputs.fast }}
        working-directory: loop
        run: |
          python3 scripts/verify-widgets-free-release-profile.py \
            --qt-prefix "$LOOP_WIDGETS_FREE_QT_PREFIX" \
            --configure \
            --build-dir "$LOOP_WIDGETS_FREE_BUILD_DIR" \
            -- \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_VCPKG_BUILD_TYPE=Release \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DLOOP_BUILD_QUICK_SHELL_SMOKE=ON \
            -DLOOP_BUILD_QUICK_CANVAS=ON \
            -DLOOP_BUILD_PRODUCT_QUICK_A11Y_SMOKE=ON \
            -DLOOP_BUILD_CANVAS_BENCHMARK=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Verify Widgets-bound target fails closed
        if: ${{ !inputs.fast }}
        working-directory: loop
        run: |
          python3 scripts/verify-widgets-free-release-profile.py \
            --qt-prefix "$LOOP_WIDGETS_FREE_QT_PREFIX" \
            --configure \
            --expect-configure-failure \
            --build-dir "$LOOP_WIDGETS_FREE_NEGATIVE_BUILD_DIR" \
            -- \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_VCPKG_BUILD_TYPE=Release \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DLOOP_BUILD_CODE_GENERATOR=ON

      - name: Build Widgets-absent release profile
        if: ${{ !inputs.fast }}
        working-directory: loop
        run: |
          cmake --build "$LOOP_WIDGETS_FREE_BUILD_DIR" --target all release_translations --config Release -j6

      - name: Smoke Widgets-absent Qt Quick backends
        if: ${{ !inputs.fast }}
        working-directory: loop
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-quick-backend-smoke.ps1 -BuildDir "$LOOP_WIDGETS_FREE_BUILD_DIR" -Mode native
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-quick-backend-smoke.ps1 -BuildDir "$LOOP_WIDGETS_FREE_BUILD_DIR" -Mode software -ExpectedGraphicsApi software

      - name: Smoke Widgets-absent product accessibility
        if: ${{ !inputs.fast }}
        working-directory: loop
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-product-quick-a11y-smoke.ps1 -BuildDir "$LOOP_WIDGETS_FREE_BUILD_DIR" -Backend native
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-product-quick-a11y-smoke.ps1 -BuildDir "$LOOP_WIDGETS_FREE_BUILD_DIR" -Backend software

      - name: Test Widgets-absent release profile
        if: ${{ !inputs.fast }}
        run: ctest --test-dir "$LOOP_WIDGETS_FREE_BUILD_DIR" --output-on-failure

      - name: Record Linux Widgets-free release evidence
        if: ${{ !inputs.fast }}
        working-directory: loop
        run: |
          python3 scripts/ci/record_widgets_free_release_evidence.py \
            --root . \
            --qt-prefix "$LOOP_WIDGETS_FREE_QT_PREFIX" \
            --manifest "$RUNNER_TEMP/loop-widgets-free-qt.json" \
            --build-dir "$LOOP_WIDGETS_FREE_BUILD_DIR" \
            --platform linux \
            --qt-version 6.11.1 \
            --build-status passed \
            --test-status passed \
            --negative-configure-status passed \
            --output "$RUNNER_TEMP/loop-widgets-free-release-evidence.json"

      - name: Upload Linux Widgets-free release evidence
        if: ${{ !inputs.fast }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: loop-widgets-free-linux-evidence
          path: |
            ${{ runner.temp }}/loop-widgets-free-qt.json
            ${{ runner.temp }}/loop-widgets-free-release-evidence.json
            ${{ runner.temp }}/loop-widgets-free-build/CMakeCache.txt
          if-no-files-found: error

      - name: Build project
        working-directory: loop
        run: |
          cmake -B build -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DLOOP_LOOP_DISTRIBUTION=ON -DLOOP_BUILD_QUICK_SHELL_SMOKE=ON -DLOOP_BUILD_CANVAS_BENCHMARK=ON -DLOOP_BUILD_QUICK_CANVAS=ON -DLOOP_BUILD_PRODUCT_QUICK_A11Y_SMOKE=ON -DLOOP_INSTALL_QT_DEPENDENCIES=0 -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_VCPKG_BUILD_TYPE=Release
          if [ "${{ inputs.fast }}" != "true" ]; then
            cmake --build build --target all release_translations --config Release -j6
            cmake --install build
          fi

      - name: Smoke Qt Quick preferred backend
        if: ${{ !inputs.fast }}
        working-directory: loop
        env:
          QT_QPA_PLATFORM: offscreen
          # Requests OpenGL (the Linux-preferred backend per ADR-007's table),
          # but GitHub-hosted ubuntu-24.04 runners have no GPU and offscreen
          # QPA does not create a real GL context, so Qt Quick's RHI falls
          # back to the software renderer here -- confirmed by an actual CI
          # run. That is ADR-007's own documented "unavailable GPU" row
          # ("platform default attempt / software backend selected
          # explicitly"), not a wiring bug, so no -ExpectedGraphicsApi
          # assertion is made for this step. QuickShellSmoke itself still
          # hard-fails (exit 3) if the reported API is Unknown, which is the
          # actual admission bar this checklist item names.
          QSG_RHI_BACKEND: opengl
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-quick-backend-smoke.ps1 -BuildDir ./build -Mode native

      - name: Smoke Qt Quick software backend
        if: ${{ !inputs.fast }}
        working-directory: loop
        env:
          QT_QPA_PLATFORM: offscreen
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-quick-backend-smoke.ps1 -BuildDir ./build -Mode software -ExpectedGraphicsApi software

      # ADR-009's CI admission scope gates on widget-baseline (comparison
      # baseline) and quick-item (the corrected S21 target); qquickwidget and
      # window-container are diagnostic-only per the amendment and are run
      # separately, non-blocking, since window-container's focus proxying is
      # known not to work under a headless offscreen platform.
      - name: Run S21 canvas benchmark (native, required candidates)
        if: ${{ !inputs.fast }}
        working-directory: loop
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-canvas-benchmark.ps1 -BuildDir ./build -Candidate widget-baseline
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-canvas-benchmark.ps1 -BuildDir ./build -Candidate quick-item

      - name: Run S21 canvas benchmark (software, required candidates)
        if: ${{ !inputs.fast }}
        working-directory: loop
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-canvas-benchmark.ps1 -BuildDir ./build -Candidate widget-baseline
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-canvas-benchmark.ps1 -BuildDir ./build -Candidate quick-item

      - name: Run S21 canvas benchmark (full diagnostic, non-blocking)
        if: ${{ !inputs.fast }}
        continue-on-error: true
        working-directory: loop
        env:
          QT_QPA_PLATFORM: offscreen
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-canvas-benchmark.ps1 -BuildDir ./build -Candidate all

      - name: Run QWidget/Quick focus bridge (native)
        if: ${{ !inputs.fast }}
        working-directory: loop
        env:
          QT_QPA_PLATFORM: offscreen
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-quick-focus-bridge.ps1 -BuildDir ./build -Mode native

      - name: Run QWidget/Quick focus bridge (software)
        if: ${{ !inputs.fast }}
        working-directory: loop
        env:
          QT_QPA_PLATFORM: offscreen
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-quick-focus-bridge.ps1 -BuildDir ./build -Mode software

      - name: Run product Quick accessibility smoke (native)
        if: ${{ !inputs.fast }}
        working-directory: loop
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-product-quick-a11y-smoke.ps1 -Backend native

      - name: Run product Quick accessibility smoke (software)
        if: ${{ !inputs.fast }}
        working-directory: loop
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-product-quick-a11y-smoke.ps1 -Backend software

      - name: Prove change with agent-fast
        if: inputs.fast
        working-directory: loop
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/agent/check-change.py --base "$BASE_SHA" --head "$HEAD_SHA" --report agent-fast-evidence.json
          else
            python3 scripts/agent/check-change.py --base "$BASE_SHA" --head "$HEAD_SHA" --report agent-fast-evidence.json --skip-changelog
          fi

      - name: Test agent policy checker
        if: inputs.fast
        working-directory: loop
        run: python3 -m unittest scripts.agent.test_check_change -v

      - name: Upload agent-fast evidence
        if: inputs.fast
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: agent-fast-evidence
          path: loop/agent-fast-evidence.json
          if-no-files-found: error

      - name: Verify loop-release product surface
        if: ${{ !inputs.fast }}
        working-directory: loop
        run: pwsh ./scripts/verify-loop-surface.ps1 -InstallDir "$GITHUB_WORKSPACE/loop/build/install" -Profile loop-release

      - name: Run unit tests
        if: ${{ !inputs.fast }}
        working-directory: loop/build
        run: |
          ctest --output-on-failure

      - name: Run preflight corpus gate
        if: ${{ !inputs.fast }}
        working-directory: loop/build
        run: |
          ctest -R UnitTestsPreflightCorpus --output-on-failure

      - name: Make DEB package
        if: ${{ !inputs.fast && github.event_name != 'pull_request' }}
        working-directory: loop/build
        run: |
          sh make-package.sh

      - name: Upload DEB package
        if: ${{ !inputs.fast }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ubuntu-deb-package
          path: ./loop/build/*.deb
          retention-days: 30
