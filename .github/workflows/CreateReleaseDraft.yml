name: Create_Release_Draft

on:
  workflow_dispatch:
    inputs:
      allow_existing_release:
        description: 'Allow uploading assets to an existing release'
        required: true
        type: boolean
        default: false
      source_sha:
        description: 'Accepted source commit used by both package workflows'
        required: true
        type: string

# Least privilege for GITHUB_TOKEN: checkout reads the repo; release creation and
# all gh calls use the MY_GITHUB_TOKEN PAT explicitly.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify exact release source SHA
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ! [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character Git SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha,,}" != "${EXPECTED_SOURCE_SHA,,}" ]; then
            echo "::error::Checkout SHA $actual_sha does not match source_sha $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      - name: Install tools
        run: |
          sudo apt-get install gh
          sudo apt-get install jq

      - name: Read version
        id: get_version
        run: |
          version=$(grep -oP 'set\(LOOP_VERSION \K[0-9]+\.[0-9]+\.[0-9]+' "CMakeLists.txt")
          prerelease=$(grep -oP 'set\(LOOP_VERSION_PRERELEASE \K[A-Za-z0-9.-]+' "CMakeLists.txt" || true)
          if [ -n "$prerelease" ]; then
            version="${version}-${prerelease}"
          fi
          echo "Version: $version"
          echo "loop_version=$version" >> $GITHUB_ENV

      - name: Stop if release already exists
        run: |
          tag="v${{ env.loop_version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "${{ inputs.allow_existing_release }}" != "true" ]; then
              echo "::error::Release $tag already exists. Refusing to upload assets because this would modify an existing release."
              echo "::error::Rerun this workflow with allow_existing_release=true only if updating that release is intentional."
              exit 1
            fi
            echo "Release $tag already exists and allow_existing_release=true, continuing."
          else
            echo "Release $tag does not exist, continuing."
          fi
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      # Both installer workflows are workflow_dispatch-only. The commit filter and
      # head-SHA check keep unrelated artifacts out of the release tag.
      - name: Get latest run ID for Linux_AppImage
        id: get_linux_run_id
        run: |
          set -euo pipefail
          latest_run=$(gh run list --workflow=Linux_AppImage \
            --commit "$EXPECTED_SOURCE_SHA" --status success \
            --json databaseId,headSha --jq '.[0] // empty')
          if [ -z "$latest_run" ]; then
            echo "::error::No successful Linux_AppImage run found for source SHA ${EXPECTED_SOURCE_SHA}."
            exit 1
          fi
          run_sha=$(echo "$latest_run" | jq -r .headSha)
          if [ "${run_sha,,}" != "${EXPECTED_SOURCE_SHA,,}" ]; then
            echo "::error::Linux_AppImage artifacts were built from ${run_sha}, but source_sha is ${EXPECTED_SOURCE_SHA}."
            echo "::error::Re-run Linux_AppImage on this exact source commit before creating the release draft."
            exit 1
          fi
          echo "linux_run_id=$(echo "$latest_run" | jq -r .databaseId)" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}

      - name: Get latest run ID for Windows_MSI
        id: get_windows_run_id
        run: |
          set -euo pipefail
          latest_run=$(gh run list --workflow=Windows_MSI \
            --commit "$EXPECTED_SOURCE_SHA" --status success \
            --json databaseId,headSha --jq '.[0] // empty')
          if [ -z "$latest_run" ]; then
            echo "::error::No successful Windows_MSI run found for source SHA ${EXPECTED_SOURCE_SHA}."
            exit 1
          fi
          run_sha=$(echo "$latest_run" | jq -r .headSha)
          if [ "${run_sha,,}" != "${EXPECTED_SOURCE_SHA,,}" ]; then
            echo "::error::Windows_MSI artifacts were built from ${run_sha}, but source_sha is ${EXPECTED_SOURCE_SHA}."
            echo "::error::Re-run Windows_MSI on this exact source commit before creating the release draft."
            exit 1
          fi
          echo "windows_run_id=$(echo "$latest_run" | jq -r .databaseId)" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}

      - name: Download Linux_AppImage artifact
        run: |
          mkdir -p artifacts
          echo "Downloading artifacts from run ID: ${{ env.linux_run_id }}..."
          gh run download ${{ env.linux_run_id }} -D artifacts
          echo "Artifacts downloaded to artifacts directory."
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Download Windows_MSI artifact
        run: |
          mkdir -p artifacts
          echo "Downloading artifacts from run ID: ${{ env.windows_run_id }}..."
          gh run download ${{ env.windows_run_id }} -D artifacts
          echo "Artifacts downloaded to artifacts directory."
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Download and validate package boundary evidence
        run: |
          set -euo pipefail
          mkdir -p package-evidence/linux package-evidence/windows
          gh run download "$linux_run_id" --name loupe-package-boundary-linux-evidence -D package-evidence/linux
          gh run download "$windows_run_id" --name loupe-package-boundary-windows-evidence -D package-evidence/windows
          python3 scripts/ci/compare_package_boundary_evidence.py \
            --linux package-evidence/linux/evidence.json \
            --windows package-evidence/windows/evidence.json \
            --source-sha "${{ inputs.source_sha }}" \
            --output package-evidence/pair.json 2>&1 | tee package-evidence/pair.txt
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Upload package boundary pair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: loupe-package-boundary-pair-evidence
          path: package-evidence
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Exclude CI evidence from release assets
        run: |
          for evidence_dir in artifacts/loupe-package-boundary-linux-evidence artifacts/loupe-package-boundary-windows-evidence; do
            if [ -e "$evidence_dir" ]; then
              rm -rf "$evidence_dir"
            fi
          done

      - name: Rezip zip file
        id: rezip_zip_file
        run: |
          cd artifacts/Loop-pdf-Windows-${{ env.loop_version }}.zip
          zip -r ../Loop-pdf-Windows-${{ env.loop_version }}.zip.backup *

      - name: Rename zip archive
        run: |
          rm -rf artifacts/Loop-pdf-Windows-${{ env.loop_version }}.zip/
          mv artifacts/Loop-pdf-Windows-${{ env.loop_version }}.zip.backup artifacts/Loop-pdf-Windows-${{ env.loop_version }}.zip

      - name: Correct file paths
        run: |
          set -euo pipefail
          # Flatten artifact subdirectories. Fail loudly on a name collision:
          # silently overwriting means a release asset is dropped, and
          # fail_on_unmatched_files cannot detect that because the glob still matches.
          while IFS= read -r -d '' src; do
            dest="artifacts/$(basename "$src")"
            if [ -e "$dest" ]; then
              echo "::error::Artifact file name collision while flattening: $src -> $dest"
              exit 1
            fi
            mv "$src" "$dest"
          done < <(find artifacts -mindepth 2 -type f -print0)
          find artifacts -type d -empty -delete

      - name: List all files recursively
        run: |
          echo "Listing all files in artifacts:"
          find artifacts -type f -print

      - name: Generate SHA-256 checksums
        run: |
          # docs/PACKAGING_LICENSING.md: "Sign artifacts and publish checksums."
          # Checksums are published here; Authenticode signing of the MSI is gated on
          # vars.SIGN_MSI in WindowsInstall.yml and requires the code-signing cert.
          cd artifacts
          # Exclude the output file: the redirection creates it before find runs, so an
          # unfiltered glob hashes an empty SHA256SUMS.txt into its own listing.
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          echo "Published checksums:"
          cat SHA256SUMS.txt

      - name: Create Release Draft
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: 'v${{ env.loop_version }}'
          name: "Release of Loop-pdf ${{ env.loop_version }} (Draft)"
          draft: true
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            artifacts/*
