name: Create_Release_Draft

on:
  workflow_dispatch:
    inputs:
      allow_existing_release:
        description: 'Allow uploading assets to an existing release'
        required: true
        type: boolean
        default: false

# Least privilege for GITHUB_TOKEN: checkout reads the repo; release creation and
# all gh calls use the MY_GITHUB_TOKEN PAT explicitly.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        
      - name: Install tools
        run: |
          sudo apt-get install gh
          sudo apt-get install jq

      - name: Read version
        id: get_version
        run: |
          version=$(grep -oP 'set\(PDF4QT_VERSION \K[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' "CMakeLists.txt")
          echo "Version: $version"
          echo "pdf4qt_version=$version" >> $GITHUB_ENV

      - name: Stop if release already exists
        run: |
          tag="v${{ env.pdf4qt_version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "${{ inputs.allow_existing_release }}" != "true" ]; then
              echo "::error::Release $tag already exists. Refusing to upload assets because this would modify an existing release."
              echo "::error::Rerun this workflow with allow_existing_release=true only if updating that release is intentional."
              exit 1
            fi
            echo "Release $tag already exists and allow_existing_release=true, continuing."
          else
            echo "Release $tag does not exist, continuing."
          fi
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      
      # Both installer workflows are workflow_dispatch-only and can be run on any
      # branch. Without a branch filter and a head-SHA check this job would happily
      # attach binaries built from unrelated code to the release tag -- and then
      # publish SHA256SUMS.txt for them.
      - name: Get latest run ID for Linux_AppImage
        id: get_linux_run_id
        run: |
          set -euo pipefail
          latest_run=$(gh run list --workflow=Linux_AppImage \
            --branch "${GITHUB_REF_NAME}" --status success \
            --json databaseId,headSha --jq '.[0] // empty')
          if [ -z "$latest_run" ]; then
            echo "::error::No successful Linux_AppImage run found on branch ${GITHUB_REF_NAME}."
            exit 1
          fi
          run_sha=$(echo "$latest_run" | jq -r .headSha)
          if [ "$run_sha" != "${GITHUB_SHA}" ]; then
            echo "::error::Linux_AppImage artifacts were built from ${run_sha}, but this release is being cut from ${GITHUB_SHA}."
            echo "::error::Re-run Linux_AppImage on this exact commit before creating the release draft."
            exit 1
          fi
          echo "linux_run_id=$(echo "$latest_run" | jq -r .databaseId)" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Get latest run ID for Windows_MSI
        id: get_windows_run_id
        run: |
          set -euo pipefail
          latest_run=$(gh run list --workflow=Windows_MSI \
            --branch "${GITHUB_REF_NAME}" --status success \
            --json databaseId,headSha --jq '.[0] // empty')
          if [ -z "$latest_run" ]; then
            echo "::error::No successful Windows_MSI run found on branch ${GITHUB_REF_NAME}."
            exit 1
          fi
          run_sha=$(echo "$latest_run" | jq -r .headSha)
          if [ "$run_sha" != "${GITHUB_SHA}" ]; then
            echo "::error::Windows_MSI artifacts were built from ${run_sha}, but this release is being cut from ${GITHUB_SHA}."
            echo "::error::Re-run Windows_MSI on this exact commit before creating the release draft."
            exit 1
          fi
          echo "windows_run_id=$(echo "$latest_run" | jq -r .databaseId)" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      
      - name: Download Linux_AppImage artifact
        run: |
          mkdir -p artifacts
          echo "Downloading artifacts from run ID: ${{ env.linux_run_id }}..."
          gh run download ${{ env.linux_run_id }} -D artifacts
          echo "Artifacts downloaded to artifacts directory."
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      
      - name: Download Windows_MSI artifact
        run: |
          mkdir -p artifacts
          echo "Downloading artifacts from run ID: ${{ env.windows_run_id }}..."
          gh run download ${{ env.windows_run_id }} -D artifacts
          echo "Artifacts downloaded to artifacts directory."
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          
      - name: Rezip zip file
        id: rezip_zip_file
        run: |
          cd artifacts/Frisket-pdf-Windows-${{ env.pdf4qt_version }}.zip
          zip -r ../Frisket-pdf-Windows-${{ env.pdf4qt_version }}.zip.backup *

      - name: Rename zip archive
        run: |
          rm -rf artifacts/Frisket-pdf-Windows-${{ env.pdf4qt_version }}.zip/
          mv artifacts/Frisket-pdf-Windows-${{ env.pdf4qt_version }}.zip.backup artifacts/Frisket-pdf-Windows-${{ env.pdf4qt_version }}.zip
          
      - name: Correct file paths
        run: |
          set -euo pipefail
          # Flatten artifact subdirectories. Fail loudly on a name collision:
          # silently overwriting means a release asset is dropped, and
          # fail_on_unmatched_files cannot detect that because the glob still matches.
          while IFS= read -r -d '' src; do
            dest="artifacts/$(basename "$src")"
            if [ -e "$dest" ]; then
              echo "::error::Artifact file name collision while flattening: $src -> $dest"
              exit 1
            fi
            mv "$src" "$dest"
          done < <(find artifacts -mindepth 2 -type f -print0)
          find artifacts -type d -empty -delete

      - name: List all files recursively
        run: |
          echo "Listing all files in artifacts:"
          find artifacts -type f -print

      - name: Generate SHA-256 checksums
        run: |
          # docs/PACKAGING_LICENSING.md: "Sign artifacts and publish checksums."
          # Checksums are published here; Authenticode signing of the MSI is gated on
          # vars.SIGN_MSI in WindowsInstall.yml and requires the code-signing cert.
          cd artifacts
          # Exclude the output file: the redirection creates it before find runs, so an
          # unfiltered glob hashes an empty SHA256SUMS.txt into its own listing.
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          echo "Published checksums:"
          cat SHA256SUMS.txt

      - name: Create Release Draft
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: 'v${{ env.pdf4qt_version }}' 
          name: "Release of Frisket-pdf ${{ env.pdf4qt_version }} (Draft)"
          draft: true
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            artifacts/*
