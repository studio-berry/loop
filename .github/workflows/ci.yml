name: CI

on:
  push:
    branches:
      - dev
      - stable
  pull_request:
    branches:
      - dev
      - stable
      
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. `contents: read` is what actions/checkout needs;
# nothing here writes back to the repository. actions/upload-artifact@v4 uses the job
# token against the artifact service and needs no additional scope.
permissions:
  contents: read

jobs:
  build_ubuntu:
    runs-on: ubuntu-24.04
    env:
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/pdf4qt/vcpkg/overlays/linux:${{ github.workspace }}/pdf4qt/vcpkg/overlays/general
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: pdf4qt

      - name: Verify supply-chain pins
        working-directory: pdf4qt
        run: python3 scripts/ci/check_supply_chain_pins.py

      - name: Verify Loupe shell contract
        working-directory: pdf4qt
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-loupe-shell-contract.ps1
      - name: Verify generated dependency paths are untracked
        working-directory: pdf4qt
        run: python3 scripts/ci/check_generated_dependency_paths.py
      - name: Test source integrity checker
        working-directory: pdf4qt
        run: python3 scripts/ci/test_check_source_integrity.py
      - name: Verify tracked source integrity
        working-directory: pdf4qt
        run: python3 scripts/ci/check_source_integrity.py
      - name: Verify branch policy
        working-directory: pdf4qt
        run: python3 scripts/ci/check_branch_policy.py

      - name: Prepare vcpkg directories
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y libcups2 libcups2-dev libfontconfig1-dev

      - name: Verify runner packaging versions
        run: |
          # The ubuntu-24.04 runner label is pinned at the job level; assert the
          # dpkg version it ships matches the recorded pin (packaging-tools.json
          # -> deb) so a runner image drift fails loudly.
          DEB_PIN="$(python3 - <<'PY'
          import json
          with open("pdf4qt/.github/pins/packaging-tools.json", encoding="utf-8") as f:
              print(json.load(f)["deb"]["dpkgVersion"])
          PY
          )"
          ACTUAL="$(dpkg-query -W -f='${Version}' dpkg)"
          test "$ACTUAL" = "$DEB_PIN" || {
              echo "::error::dpkg version drift: expected $DEB_PIN, runner has $ACTUAL"
              exit 1
          }

      - name: 'VCPKG: Set up VCPKG'
        run: |
          VCPKG_COMMIT="$(python3 - <<'PY'
          import json
          with open("pdf4qt/vcpkg-configuration.json", encoding="utf-8") as f:
              print(json.load(f)["default-registry"]["baseline"])
          PY
          )"

          if ! [[ "$VCPKG_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid vcpkg baseline: $VCPKG_COMMIT"
              exit 1
          fi

          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout --detach "$VCPKG_COMMIT"

          ACTUAL="$(git -C vcpkg rev-parse HEAD)"
          test "$ACTUAL" = "$VCPKG_COMMIT" || {
              echo "::error::vcpkg checkout does not match manifest baseline"
              exit 1
          }

          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg integrate install

      - name: 'VCPKG: Cache vcpkg dependencies'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ./vcpkg/downloads
            ./vcpkg/packages
            ./vcpkg_installed
          key: ${{ runner.os }}-vcpkg-v2-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v2-

      - name: 'VCPKG: Install project dependencies'
        run: |
          ./vcpkg install --x-manifest-root=$GITHUB_WORKSPACE/pdf4qt --x-install-root=$VCPKG_INSTALLED_DIR --clean-buildtrees-after-build --clean-packages-after-build
        working-directory: vcpkg
        
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: '6.11.1'
          host: 'linux'
          target: 'desktop'
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          modules: 'qtspeech qtmultimedia'
          cache: 'true'
          cache-key-prefix: ${{ runner.os }}-qt-6111

      - name: Build project
        working-directory: pdf4qt
        run: |
          cmake -B build -S . -DPDF4QT_INSTALL_QT_DEPENDENCIES=0 -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_VCPKG_BUILD_TYPE=Release
          cmake --build build --target all release_translations --config Release -j6
          cmake --install build

      - name: Verify developer product surface
        working-directory: pdf4qt
        run: pwsh ./scripts/verify-loupe-surface.ps1 -InstallDir "$GITHUB_WORKSPACE/pdf4qt/build/install" -Profile developer

      - name: Run unit tests
        working-directory: pdf4qt/build
        run: |
          ctest --output-on-failure

      - name: Run preflight corpus gate
        working-directory: pdf4qt/build
        run: |
          ctest -R UnitTestsPreflightCorpus --output-on-failure

      - name: Make DEB package
        if: github.event_name != 'pull_request'
        working-directory: pdf4qt/build
        run: |
          sh make-package.sh

      - name: Upload DEB package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ubuntu-deb-package
          path: ./pdf4qt/build/*.deb
          retention-days: 30

  build_windows:
    runs-on: windows-2022
    env:
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\pdf4qt\vcpkg\overlays\general
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: pdf4qt

      - name: Verify supply-chain pins
        working-directory: pdf4qt
        shell: pwsh
        run: |
          python scripts\ci\check_supply_chain_pins.py

      - name: Verify Loupe shell contract
        working-directory: pdf4qt
        shell: pwsh
        run: .\scripts\verify-loupe-shell-contract.ps1
      - name: Verify generated dependency paths are untracked
        working-directory: pdf4qt
        shell: pwsh
        run: |
          python scripts\ci\check_generated_dependency_paths.py
      - name: Test source integrity checker
        working-directory: pdf4qt
        shell: pwsh
        run: |
          python scripts\ci\test_check_source_integrity.py
      - name: Verify tracked source integrity
        working-directory: pdf4qt
        shell: pwsh
        run: |
          python scripts\ci\check_source_integrity.py
      - name: Verify branch policy
        working-directory: pdf4qt
        shell: pwsh
        run: |
          python scripts\ci\check_branch_policy.py

      - name: Prepare vcpkg directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: 'VCPKG: Set up VCPKG'
        shell: pwsh
        run: |
          $configPath = Join-Path $env:GITHUB_WORKSPACE "pdf4qt\vcpkg-configuration.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $vcpkgCommit = $config.'default-registry'.baseline

          if ($vcpkgCommit -notmatch '^[0-9a-f]{40}$') {
              throw "Invalid vcpkg baseline: $vcpkgCommit"
          }

          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout --detach $vcpkgCommit

          $actual = (git -C vcpkg rev-parse HEAD).Trim()
          if ($actual -ne $vcpkgCommit) {
              throw "vcpkg checkout $actual does not match manifest baseline $vcpkgCommit"
          }

          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg\vcpkg.exe integrate install

      - name: 'VCPKG: Cache vcpkg dependencies'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ./vcpkg/downloads
            ./vcpkg/packages
            ./vcpkg/installed
            ./vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-


      - name: 'VCPKG: Install project dependencies'
        run: |
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE 'pdf4qt'
          .\vcpkg.exe install --triplet x64-windows --x-manifest-root=$manifestRoot --x-install-root=$env:VCPKG_INSTALLED_DIR --clean-buildtrees-after-build --clean-packages-after-build
        working-directory: vcpkg
        
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: '6.11.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          modules: 'qtspeech qtmultimedia'
          cache: 'true'
          cache-key-prefix: ${{ runner.os }}-qt-6111
          # aqtinstall 3.3.0 cannot resolve Qt 6.11+ Windows repo layout (miurahr/aqtinstall#1007).
          # Pin PR #1000 merge until aqtinstall >3.3.0 ships with that fix.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b

      - name: Build project
        working-directory: pdf4qt
        shell: pwsh
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_VCPKG_BUILD_TYPE=Release -DPDF4QT_INSTALL_QT_DEPENDENCIES=ON -DPDF4QT_INSTALL_DEPENDENCIES=ON -DCMAKE_TOOLCHAIN_FILE="${env:GITHUB_WORKSPACE}\vcpkg\scripts\buildsystems\vcpkg.cmake" -DPDF4QT_QT_ROOT="${env:Qt6_DIR}" -DPDF4QT_INSTALL_MSVC_REDISTRIBUTABLE=ON -DPDF4QT_INSTALL_PREPARE_WIX_INSTALLER=ON -DPDF4QT_INSTALL_TO_USR=ON
          cmake --build build --target release_translations --config Release -j6
          cmake --build build --config Release -j6
          cmake --install build --config Release

      - name: Verify developer product surface
        working-directory: pdf4qt
        shell: pwsh
        run: .\scripts\verify-loupe-surface.ps1 -InstallDir "${env:GITHUB_WORKSPACE}\pdf4qt\build\install\usr\bin" -Profile developer

      - name: Run unit tests
        working-directory: pdf4qt/build
        shell: pwsh
        run: |
          ctest -C Release --output-on-failure

      - name: Run preflight corpus gate
        working-directory: pdf4qt/build
        shell: pwsh
        run: |
          ctest -C Release -R UnitTestsPreflightCorpus --output-on-failure

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: 'pdf4qt-${{ runner.os }}.zip'
          path: .\pdf4qt\build\install\usr\bin
          retention-days: 30

  # Single always-running status check for branch protection.
  #
  # Require this job in branch protection instead of the platform-specific build jobs:
  # it provides one stable status name for both branch targets and fails if either
  # build job failed or was cancelled.
  #
  # Running the full workflow for documentation changes keeps this required status
  # present on every pull request.
  ci_ok:
    # Not `always()`: that also fires when concurrency cancel-in-progress supersedes the
    # run, reporting a red check against a commit nobody is waiting on. `!cancelled()`
    # still runs when a build job *failed* (unlike success()) and when both were skipped
    # by paths-ignore, but skips cleanly on cancellation.
    if: ${{ !cancelled() }}
    needs: [build_ubuntu, build_windows]
    runs-on: ubuntu-latest
    # Reads only the needs context; no repository access required.
    permissions: {}
    steps:
      - name: Check build job results
        run: |
          echo "build_ubuntu:  ${{ needs.build_ubuntu.result }}"
          echo "build_windows: ${{ needs.build_windows.result }}"
          for result in "${{ needs.build_ubuntu.result }}" "${{ needs.build_windows.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required build job did not succeed."; exit 1 ;;
            esac
          done
          echo "All required build jobs succeeded or were skipped."
