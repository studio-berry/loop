name: CI

on:
  push:
    branches:
      - dev
      - stable
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. `contents: read` is what actions/checkout needs;
# nothing here writes back to the repository. actions/upload-artifact@v4 uses the job
# token against the artifact service and needs no additional scope.
permissions:
  contents: read

jobs:
  source_integrity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Test source integrity checker
        run: python3 scripts/ci/test_check_source_integrity.py
      - name: Verify tracked source integrity
        run: python3 scripts/ci/check_source_integrity.py
      - name: Verify generated dependency paths are untracked
        run: python3 scripts/ci/check_generated_dependency_paths.py

  linux:
    needs: [source_integrity]
    uses: ./.github/workflows/reusable-linux.yml

  windows:
    needs: [source_integrity]
    uses: ./.github/workflows/reusable-windows.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
