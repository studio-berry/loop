name: CI

on:
  push:
    branches:
      - dev
      - stable
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source_integrity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Test source integrity checker
        run: python3 scripts/ci/test_check_source_integrity.py
      - name: Test workflow contracts
        run: python3 -m unittest scripts.ci.test_workflow_contracts -v
      - name: Verify tracked source integrity
        run: python3 scripts/ci/check_source_integrity.py
      - name: Verify unmanaged async launch allowlist
        run: python3 scripts/ci/check_unmanaged_async.py
      - name: Verify semantic-trust source boundaries
        run: python3 scripts/ci/test_check_trust_contract_sources.py && python3 scripts/ci/check_trust_contract_sources.py
      - name: Verify generated dependency paths are untracked
        run: python3 scripts/ci/check_generated_dependency_paths.py
      - name: Verify Phase 5 Widgets evidence is current
        run: python3 scripts/generate_phase5_widgets_evidence.py --check
      - name: Verify Phase 5 Widgets completeness contract
        run: python3 scripts/verify_phase5_widgets_contract.py
      - name: Verify plugin and legacy form accounting
        run: |
          python3 scripts/verify-plugin-form-accounting.py
          python3 -m unittest scripts.ci.test_verify_plugin_form_accounting -q
      - name: Verify Widgets library consumer graph
        run: |
          python3 scripts/generate_widgets_library_consumer_graph.py --check
          python3 scripts/verify-widgets-library-consumer-graph.py
          python3 scripts/verify-widgets-free-release-profile.py
          python3 -m unittest scripts.ci.test_verify_widgets_library_consumer_graph -q

  agent-fast:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/reusable-linux.yml
    with:
      fast: true
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  linux:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/stable') || github.event_name == 'workflow_dispatch'
    needs: [source_integrity]
    uses: ./.github/workflows/reusable-linux.yml

  windows:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/stable') || github.event_name == 'workflow_dispatch'
    needs: [source_integrity]
    uses: ./.github/workflows/reusable-windows.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
