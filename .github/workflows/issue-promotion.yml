name: Track issue promotion

on:
  push:
    branches:
      - dev
      - stable

concurrency:
  group: issue-promotion-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Test issue promotion logic
        run: python3 -m scripts.github.test_issue_promotion

      - name: Update issue promotion state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/github/issue_promotion.py
