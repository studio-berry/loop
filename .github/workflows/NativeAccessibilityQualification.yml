name: Native_Accessibility_Qualification
run-name: Native_Accessibility_Qualification (${{ inputs.platform }} ${{ inputs.source_sha }})

on:
  # Dispatch-only. Qualifies the exact package and kit from one completed
  # LinuxInstall or WindowsInstall run. This workflow has no cache writers, so
  # running the candidate checkout here cannot poison packaging caches.
  workflow_dispatch:
    inputs:
      platform:
        description: "Package platform to qualify"
        required: true
        type: choice
        options:
          - linux
          - windows
      source_sha:
        description: "Accepted Session 06 source commit the package was built from"
        required: true
        type: string
      build_run_id:
        description: "Completed LinuxInstall or WindowsInstall run that produced the package and kit"
        required: true
        type: string
      package_name:
        description: "Package artifact name from that run's step summary"
        required: true
        type: string

# Least privilege for GITHUB_TOKEN: checkout reads the repo, and actions:read
# lets the job download the package and kit from the completed build run.
permissions:
  actions: read
  contents: read

jobs:
  qualify_linux:
    if: inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Install OS accessibility client
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core dbus-x11 xvfb xauth openbox x11-utils libxcb-cursor0 libspeechd2 libcups2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.package_name }}
          path: package
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quick-a11y-kit-linux
          path: kit
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Qualify final AppImage on a fresh runner
        env:
          LOOP_SOURCE_SHA: ${{ inputs.source_sha }}
          LOOP_PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOOP_SOURCE_SHA"
          python3 scripts/ci/quick_a11y_kit.py --source-sha "$LOOP_SOURCE_SHA" --output kit
          chmod +x "package/$LOOP_PACKAGE_NAME" kit/ProductQuickAccessibilitySmoke
          mkdir -p "$RUNNER_TEMP/native-qualification"
          python3 scripts/ci/inspect_package_dependencies.py --platform linux --package "package/$LOOP_PACKAGE_NAME" --source-sha "$LOOP_SOURCE_SHA" --work-dir "$RUNNER_TEMP/package-inspection" --output "$RUNNER_TEMP/native-qualification/package-boundary.json"
          export LOOP_INSTALL_TREE="$RUNNER_TEMP/package-inspection/appimage/squashfs-root"
          export LOOP_PACKAGE="$GITHUB_WORKSPACE/package/$LOOP_PACKAGE_NAME"
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH QML_IMPORT_PATH LD_LIBRARY_PATH QT_ROOT_DIR LOOP_QT_ROOT
          dbus-run-session -- xvfb-run -a bash scripts/qualification/qualify-linux-accessibility.sh "$LOOP_INSTALL_TREE" "$GITHUB_WORKSPACE/kit" "$LOOP_PACKAGE" "$LOOP_SOURCE_SHA" "$RUNNER_TEMP/native-qualification" 2>&1 | tee "$RUNNER_TEMP/native-qualification/transcript.txt"
      - name: Upload clean-machine accessibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loop-native-accessibility-linux-evidence
          path: ${{ runner.temp }}/native-qualification
          if-no-files-found: error

  qualify_windows:
    if: inputs.platform == 'windows'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.package_name }}
          path: package
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quick-a11y-kit-windows
          path: kit
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Qualify installed MSI on a fresh runner
        shell: pwsh
        env:
          LOOP_SOURCE_SHA: ${{ inputs.source_sha }}
          LOOP_PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          if ((git rev-parse HEAD) -ne $env:LOOP_SOURCE_SHA) { throw 'Checkout is not the qualification source SHA.' }
          $evidence = Join-Path $env:RUNNER_TEMP 'native-qualification'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          ./scripts/qualification/qualify-windows-accessibility.ps1 -Package (Join-Path $env:GITHUB_WORKSPACE "package/$env:LOOP_PACKAGE_NAME") -Kit (Join-Path $env:GITHUB_WORKSPACE 'kit') -SourceSha $env:LOOP_SOURCE_SHA -EvidenceDirectory $evidence 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'transcript.txt')
      - name: Upload clean-machine accessibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loop-native-accessibility-windows-evidence
          path: ${{ runner.temp }}/native-qualification
          if-no-files-found: error
