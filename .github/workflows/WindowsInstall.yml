name: Windows_MSI

on:
  # Packaging runs on every pull request as well, so a change that breaks the MSI or
  # the AppImage fails here instead of surviving until someone dispatches a run by
  # hand. Narrow this with a `paths:` filter if the runner cost becomes a problem.
  pull_request:

  # Keep manual packaging qualification available for exact source SHAs.
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Accepted Session 06 source commit to package"
        required: true
        type: string

# Least privilege for GITHUB_TOKEN: checkout reads the repo, artifacts are uploaded
# via the job token, and signing uses the DigiCert SM_* secrets rather than this token.
permissions:
  contents: read

jobs:
  build_windows:
    runs-on: windows-2022
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\loop\vcpkg\overlays\general
      QT_QPA_PLATFORM: offscreen
      SENTRY_DSN: off

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: loop
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact source SHA
        working-directory: loop
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
        run: |
          if ($env:EXPECTED_SOURCE_SHA -notmatch "^[0-9a-fA-F]{40}$") {
            throw "source_sha must be a full 40-character Git SHA"
          }
          $actualSha = (git rev-parse HEAD).Trim()
          $expectedSha = ([string]$env:EXPECTED_SOURCE_SHA).ToLowerInvariant()
          if ($actualSha.ToLowerInvariant() -ne $expectedSha) {
            throw "Checkout SHA $actualSha does not match source_sha $env:EXPECTED_SOURCE_SHA"
          }
          "LOOP_SOURCE_SHA=$actualSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packaging source SHA: $actualSha"

      - name: Verify supply-chain pins
        working-directory: loop
        run: python scripts\ci\check_supply_chain_pins.py

      - name: Verify Phase 5 Widgets completeness contract
        working-directory: loop
        shell: pwsh
        run: .\scripts\verify-phase5-widgets-contract.ps1

      - name: Add pinned MakeAppx to PATH
        shell: pwsh
        run: |
          # Pin Windows SDK (and MakeAppx.exe) to the exact version recorded in
          # .github/pins/packaging-tools.json and verify its SHA-256 before use.
          # This replaces the previous "highest SDK found" scan, which silently
          # followed runner image drift.
          $pins = Get-Content -Raw "$env:GITHUB_WORKSPACE\loop\.github\pins\packaging-tools.json" | ConvertFrom-Json
          $sdkVersion = $pins.windowsSdk.version
          $expectedHash = "$($pins.windowsSdk.makeAppxSha256)".ToLowerInvariant()

          $makeAppxPath = "C:\Program Files (x86)\Windows Kits\10\bin\${sdkVersion}\x64\MakeAppx.exe"
          if (-not (Test-Path $makeAppxPath)) {
            throw "Pinned Windows SDK $sdkVersion MakeAppx.exe not found at $makeAppxPath - runners do not install it; update .github/pins/packaging-tools.json (and keep the hash in sync)."
          }

          $actualHash = (Get-FileHash $makeAppxPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "MakeAppx.exe SHA256 mismatch: expected $expectedHash, got $actualHash"
          }

          $sdkPath = Split-Path $makeAppxPath
          Write-Host "Pinned MakeAppx verified: $makeAppxPath"
          echo "PATH=$env:PATH;$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify MakeAppx Path
        shell: pwsh
        run: |
          $makeAppxPath = Get-Command MakeAppx.exe | Select-Object -ExpandProperty Definition
          Write-Host "MakeAppx.exe found at: $makeAppxPath"

      - name: Setup Variables and Install Keylocker KSP
        shell: pwsh
        if: vars.SIGN_MSI == 'true'
        run: |
          # Supply-chain gate: signing MUST NOT proceed while the DigiCert
          # KeyLocker toolset is unpinned. The pin block (version/url/sha256)
          # lives in .github/pins/packaging-tools.json.
          $pins = Get-Content -Raw "$env:GITHUB_WORKSPACE\loop\.github\pins\packaging-tools.json" | ConvertFrom-Json
          $keylocker = $pins.digicertKeylocker
          if ([string]::IsNullOrWhiteSpace([string]$keylocker.version) -or
              [string]::IsNullOrWhiteSpace([string]$keylocker.url) -or
              [string]::IsNullOrWhiteSpace([string]$keylocker.sha256)) {
            throw "DigiCert KeyLocker tools are not pinned (packaging-tools.json -> digicertKeylocker). Refusing to sign with an unpinned toolchain. Update the pins before enabling SIGN_MSI."
          }

          # Decode the base64-encoded certificate
          $certificateBase64 = '${{ secrets.SM_CLIENT_CERT_FILE_B64 }}'
          $certificateBytes = [Convert]::FromBase64String($certificateBase64)
          $certPath = "$env:GITHUB_WORKSPACE\JM_AuthCert.p12"

          # Write the certificate to a file
          [System.IO.File]::WriteAllBytes($certPath, $certificateBytes)

          # Compute the hash of the certificate file
          $hash = Get-FileHash -Path $certPath -Algorithm SHA256
          Write-Host "Authorization certificate hash: $($hash.Hash)"

          # Set GitHub Actions outputs
          echo "KEYPAIR_NAME=gt-standard-keypair" >> $env:GITHUB_OUTPUT
          echo "CERTIFICATE_NAME=gt-certificate" >> $env:GITHUB_OUTPUT

          # Set environment variables
          echo "SM_HOST=${{ secrets.SM_HOST }}" >> "$env:GITHUB_ENV"
          echo "SM_API_KEY=${{ secrets.SM_API_KEY }}" >> "$env:GITHUB_ENV"
          echo "SM_CLIENT_CERT_FILE=$certPath" >> "$env:GITHUB_ENV"
          echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}" >> "$env:GITHUB_ENV"

          $installer = Join-Path $env:RUNNER_TEMP "Keylockertools-windows-x64.msi"

          # Add paths to PATH environment variable
          echo "C:\Program Files (x86)\Windows Kits\10\App Certification Kit" >> $env:GITHUB_PATH
          echo "C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8 Tools" >> $env:GITHUB_PATH
          echo "C:\Program Files\DigiCert\DigiCert Keylocker Tools" >> $env:GITHUB_PATH

          # Download and install the Keylocker tools
          & "$env:GITHUB_WORKSPACE\loop\scripts\ci\download_verified.ps1" `
            -Url $pins.digicertKeylocker.url `
            -OutFile $installer `
            -Sha256 $pins.digicertKeylocker.sha256

          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') {
            throw "DigiCert KeyLocker installer Authenticode signature is not valid: $($signature.Status)"
          }

          $install = Start-Process msiexec.exe `
            -ArgumentList @('/i', "`"$installer`"", '/quiet', '/qn') `
            -Wait `
            -NoNewWindow `
            -PassThru
          if ($install.ExitCode -ne 0) {
            throw "DigiCert KeyLocker installer failed with exit code $($install.ExitCode)"
          }

      - name: Certificates Sync
        shell: pwsh
        if: vars.SIGN_MSI == 'true'
        run: |
          # Sync certificates
          smctl windows certsync

      - name: Prepare vcpkg directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: 'VCPKG: Set up VCPKG'
        run: |
          $manifest = Get-Content -Raw "$env:GITHUB_WORKSPACE\loop\vcpkg-configuration.json" | ConvertFrom-Json
          $VCPKG_COMMIT = $manifest.'default-registry'.baseline
          if ($VCPKG_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid vcpkg baseline in vcpkg-configuration.json: $VCPKG_COMMIT"
          }

          git clone https://github.com/microsoft/vcpkg.git
          git -C vcpkg checkout --detach $VCPKG_COMMIT

          $ACTUAL = git -C vcpkg rev-parse HEAD
          if ($ACTUAL -ne $VCPKG_COMMIT) {
            throw "vcpkg checkout does not match manifest baseline (expected $VCPKG_COMMIT, got $ACTUAL)"
          }

          cd vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg integrate install
          "VCPKG_BINARY_SOURCES=clear;files,$env:GITHUB_WORKSPACE\vcpkg-binary-cache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 'VCPKG: Cache vcpkg dependencies'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ./vcpkg/downloads
            ./vcpkg/packages
            ./vcpkg_installed
            ./vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-v2-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v2-

      - name: 'VCPKG: Install project dependencies'
        run: |
          # Seed the two GNU archives through the primary GNU host.  The
          # vcpkg portfiles prefer ftpmirror.gnu.org, which intermittently
          # returned 502/503 during package qualification; a verified
          # filename in downloads lets vcpkg reuse the archive and keeps the
          # existing portfile hash verification authoritative.
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          curl.exe --fail --location --retry 5 --retry-delay 5 --retry-all-errors `
            --output downloads\automake-1.17.tar.gz `
            https://ftp.gnu.org/gnu/automake/automake-1.17.tar.gz
          curl.exe --fail --location --retry 5 --retry-delay 5 --retry-all-errors `
            --output downloads\gperf-3.3.tar.gz `
            https://ftp.gnu.org/gnu/gperf/gperf-3.3.tar.gz
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE 'loop'
          .\vcpkg.exe install --triplet x64-windows --x-manifest-root=$manifestRoot --x-install-root=$env:VCPKG_INSTALLED_DIR --clean-buildtrees-after-build --clean-packages-after-build
        working-directory: vcpkg

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: '6.11.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          modules: 'qtspeech qtmultimedia qtimageformats'
          cache: 'true'
          cache-key-prefix: ${{ runner.os }}-qt-6111
          # aqtinstall 3.3.0 cannot resolve Qt 6.11+ Windows repo layout (miurahr/aqtinstall#1007).
          # Pin PR #1000 merge until aqtinstall >3.3.0 ships with that fix.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b


      - name: Find VC Redistributable Directories
        shell: pwsh
        run: |
          # Define the base path to the VC redistributable directories
          $basePath = "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC"
          $arch = "x64"

          # Find directories that match the pattern for VC redistributables
          $redistDirs = Get-ChildItem -Path $basePath -Recurse -Directory -Filter "Microsoft.VC*.CRT" | Where-Object { $_.FullName -notmatch "debug_nonredist" -and $_.FullName -match "\\$arch\\" -and $_.FullName -notmatch "onecore" }

          # Extract the toolset version from the directory names
          if ($redistDirs) {
              $firstRedistDir = $redistDirs | Select-Object -First 1
              $toolsetVersion = $firstRedistDir.Name -replace '^Microsoft\.VC(\d+)\.CRT$', '$1'
              Write-Host "Found MSVC Toolset Version: $toolsetVersion"
              Write-Host "Found MSVC Redistributable Full Path: $firstRedistDir"
              echo "MSVC_TOOLSET_VERSION=$toolsetVersion" >> $env:GITHUB_ENV
              echo "VCToolsRedistDir=$($firstRedistDir.Parent.Parent.Parent.FullName)" >> $env:GITHUB_ENV
              echo "VSCMD_ARG_TGT_ARCH=$arch" >> $env:GITHUB_ENV
              echo "MSVC_REDISTRIBUTABLES_PATH=$firstRedistDir" >> $env:GITHUB_ENV
          } else {
              Write-Error "No valid redistributable directories found."
          }

      - name: Build project
        working-directory: loop
        shell: pwsh
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_VCPKG_BUILD_TYPE=Release -DLOOP_INSTALL_QT_DEPENDENCIES=ON -DLOOP_INSTALL_DEPENDENCIES=ON -DCMAKE_TOOLCHAIN_FILE="${env:GITHUB_WORKSPACE}\vcpkg\scripts\buildsystems\vcpkg.cmake" -DLOOP_QT_ROOT="${env:QT_ROOT_DIR}" -DLOOP_INSTALL_MSVC_REDISTRIBUTABLE=ON -DLOOP_INSTALL_PREPARE_WIX_INSTALLER=ON -DLOOP_INSTALL_TO_USR=ON -DLOOP_LOOP_DISTRIBUTION=ON -DLOOP_PLUGIN_OCR=OFF -DLOOP_BUNDLE_OCR_SERVICE=OFF -DLOOP_BUILD_PRODUCT_QUICK_A11Y_SMOKE=ON
          cmake --build build --target LoopEditor PdfTool ProductQuickAccessibilitySmoke release_translations --config Release -j6
          cmake --install build --config Release
          .\scripts\verify-loop-surface.ps1 -InstallDir "${env:GITHUB_WORKSPACE}\loop\build\install\usr\bin" -Profile loop-release -BuildDir .\build -InstallManifestPath .\build\install_manifest.txt
          python scripts\verify-widgets-free-release-profile.py --install-dir .\build\install

      - name: Smoke relocated installed tree
        shell: pwsh
        env:
          QT_DEBUG_PLUGINS: "1"
          QML_IMPORT_TRACE: "1"
        run: |
          $relocated = Join-Path $env:RUNNER_TEMP "loop-installed-smoke"
          if (Test-Path -LiteralPath $relocated) { Remove-Item -LiteralPath $relocated -Recurse -Force }
          # Copy-Item to a destination that does not exist copies the source
          # *contents* directly into it (no extra `install` level), so the
          # relocated binaries live at $relocated\usr\bin, not
          # $relocated\install\usr\bin.
          Copy-Item -LiteralPath "${env:GITHUB_WORKSPACE}\loop\build\install" -Destination $relocated -Recurse
          & ".\loop\scripts\smoke-test-install.ps1" -InstallDir (Join-Path $relocated "usr\bin") -SourceSha $env:LOOP_SOURCE_SHA -SkipEditorLaunch

      - name: Upload Sentry debug files
        # Do not use `if: secrets.*` — GitHub rejects the secrets context in
        # conditionals and the workflow file fails to parse. The script no-ops
        # when SENTRY_AUTH_TOKEN is unset (fork pull requests).
        working-directory: loop
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_ORG: berry-studios
          SENTRY_URL: https://de.sentry.io
        run: |
          .\scripts\ci\upload_sentry_debug_files.ps1 -BuildDir "${env:GITHUB_WORKSPACE}\loop\build"

      - name: Run product Quick accessibility qualification harness (native)
        shell: pwsh
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP "loop-package-boundary-windows"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          "source_sha=$env:LOOP_SOURCE_SHA" | Set-Content -Path (Join-Path $evidenceDir "quick-a11y-native.txt")
          & ".\loop\scripts\run-product-quick-a11y-smoke.ps1" -BuildDir ".\loop\build" -Backend native 2>&1 | Tee-Object -FilePath (Join-Path $evidenceDir "quick-a11y-native.txt") -Append
          if ($LASTEXITCODE -ne 0) { throw "Native product Quick accessibility qualification harness failed." }

      - name: Run product Quick accessibility qualification harness (software)
        shell: pwsh
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP "loop-package-boundary-windows"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          "source_sha=$env:LOOP_SOURCE_SHA" | Set-Content -Path (Join-Path $evidenceDir "quick-a11y-software.txt")
          & ".\loop\scripts\run-product-quick-a11y-smoke.ps1" -BuildDir ".\loop\build" -Backend software 2>&1 | Tee-Object -FilePath (Join-Path $evidenceDir "quick-a11y-software.txt") -Append
          if ($LASTEXITCODE -ne 0) { throw "Software product Quick accessibility qualification harness failed." }

      - name: Validate staged install tree
        shell: pwsh
        run: |
          # Verifies layout, profile/schema resolution and a real PdfTool preflight run
          # against the staged tree before it is packaged, and enforces the
          # docs/PACKAGING_LICENSING.md prohibition on Ghostscript / JRE / Python
          # payloads -- previously a manual checklist item with nothing checking it.
          # Editor launch is skipped: no interactive desktop on the runner.
          .\loop\scripts\smoke-test-install.ps1 `
            -InstallDir "${env:GITHUB_WORKSPACE}\loop\build\install\usr\bin" `
            -SourceSha $env:LOOP_SOURCE_SHA `
            -SkipEditorLaunch

      - name: Generate third-party notices
        shell: pwsh
        env:
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg\installed
        run: |
          .\loop\scripts\generate-third-party-notices.ps1 `
            -OutputPath "${env:GITHUB_WORKSPACE}\loop\build\install\THIRD_PARTY_NOTICES.txt"

      - name: Read version
        id: get_version
        shell: pwsh
        run: |
          $version = Get-Content -Path ".\loop\build\version.txt" -Raw
          $version = $version.Trim()  # Odstraní případné prázdné znaky kolem verze
          Write-Host "Version: $version"
          echo "loop_version=$version" >> $env:GITHUB_ENV
          echo "msipackagefilename=mberrys.Loop-pdf_${version}.msi" >> $env:GITHUB_ENV
          Write-Host "MSI package file name: mberrys.Loop-pdf_${version}.msi"

      - name: Download verified WiX Toolset
        shell: pwsh
        run: |
          # WiX is pinned to an exact versioned release in packaging-tools.json
          # (wix.url + wix.sha256). Download it and verify the digest before any
          # candle/light run; the previous step relied on whatever WiX toolset
          # happened to be preinstalled on the runner image.
          $pins = Get-Content -Raw "$env:GITHUB_WORKSPACE\loop\.github\pins\packaging-tools.json" | ConvertFrom-Json
          $wixZip = "$env:GITHUB_WORKSPACE\wix314-binaries.zip"
          & "$env:GITHUB_WORKSPACE\loop\scripts\ci\download_verified.ps1" `
            -Url $pins.wix.url `
            -OutFile $wixZip `
            -Sha256 $pins.wix.sha256

          $wixDir = "$env:GITHUB_WORKSPACE\wix"
          Expand-Archive -Path $wixZip -DestinationPath $wixDir -Force

          foreach ($required in "candle.exe", "light.exe", "heat.exe", "WiXUIExtension.dll") {
            if (-not (Test-Path (Join-Path $wixDir $required))) {
              throw "Pinned WiX toolset is missing $required under $wixDir"
            }
          }
          Write-Host "Pinned WiX $($pins.wix.version) verified at $wixDir"
          echo "wixdir=$wixDir" >> $env:GITHUB_ENV
          echo "wixuiextpath=$wixDir\WiXUIExtension.dll" >> $env:GITHUB_ENV

      - name: Create MSI Package
        working-directory: loop\build\WixInstaller
        run: |
          $wixBin = "$env:wixdir"
          & "$wixBin\heat.exe" dir "${env:GITHUB_WORKSPACE}\loop\build\install" -cg LOOP_InstalledTree -dr INSTALLFOLDER -gg -sfrag -srd -out HarvestedInstall.wxs
          & "$wixBin\candle.exe" -v -d"SolutionDir=." -d"SolutionExt=.sln" -d"SolutionFileName=LOOP.sln" -d"SolutionName=LOOP" -d"SolutionPath=LOOP.sln" -d"Configuration=Release" -d"OutDir=bin\Release\" -d"Platform=x64" -d"ProjectDir=." -d"ProjectExt=.wixproj" -d"ProjectFileName=LOOP.wixproj" -d"ProjectName=LOOP" -d"ProjectPath=LOOP.wixproj" -d"TargetDir=bin\Release\" -d"TargetExt=.msi" -d"TargetFileName=${{ env.msipackagefilename }}" -d"TargetName=LOOP" -d"TargetPath=bin\Release\${{ env.msipackagefilename }}" -out obj\Release\ -arch x64 -ext $env:wixuiextpath Product.wxs
          & "$wixBin\candle.exe" -v -out obj\Release\ -arch x64 HarvestedInstall.wxs
          & "$wixBin\light.exe" -v -out ${{ github.workspace }}\loop\build\install\${{ env.msipackagefilename }} -pdbout .\bin\Release\LOOP.wixpdb -cultures:null -ext "$env:wixuiextpath" -contentsfile obj\Release\LOOP.wixproj.BindContentsFileListnull.txt -outputsfile obj\Release\LOOP.wixproj.BindOutputsFileListnull.txt -builtoutputsfile obj\Release\LOOP.wixproj.BindBuiltOutputsFileListnull.txt -wixprojectfile .\LOOP.wixproj obj\Release\Product.wixobj obj\Release\HarvestedInstall.wixobj

      - name: Sign MSI Package
        shell: pwsh
        if: vars.SIGN_MSI == 'true'
        run: |
          signtool.exe sign /sha1 ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }} /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 "${{ github.workspace }}\loop\build\install\${{ env.msipackagefilename }}"
          signtool.exe verify /v /pa "${{ github.workspace }}\loop\build\install\${{ env.msipackagefilename }}"

      - name: Inspect MSI package boundary
        shell: pwsh
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP "loop-package-boundary-windows"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $msiPath = Join-Path $env:GITHUB_WORKSPACE "loop\build\install\${{ env.msipackagefilename }}"
          $inspectorOutput = @(& python ".\loop\scripts\ci\inspect_package_dependencies.py" `
            --platform windows `
            --package $msiPath `
            --source-sha $env:LOOP_SOURCE_SHA `
            --expected-architecture x64 `
            --work-dir (Join-Path $env:RUNNER_TEMP "loop-package-boundary-windows-work") `
            --output (Join-Path $evidenceDir "evidence.json") `
            --report (Join-Path $evidenceDir "inspection.txt") 2>&1)
          $inspectorOutput | Tee-Object -FilePath (Join-Path $evidenceDir "inspector.txt")
          if ($LASTEXITCODE -ne 0) { throw "MSI package boundary inspection failed." }

      - name: Run MSI lifecycle smoke test
        shell: pwsh
        run: |
          # The release MSI is x64 and must install beneath 64-bit Program Files.
          # The full editor operator launch is skipped on the hosted runner; the
          # packaged native/software Quick startup is exercised by the smoke script.
          $msiPath = Join-Path $env:GITHUB_WORKSPACE "loop\build\install\${{ env.msipackagefilename }}"
          $installDir = Join-Path ([Environment]::GetFolderPath("ProgramFiles")) "LOOP"
          & "${env:GITHUB_WORKSPACE}\loop\scripts\Invoke-MsiSmokeTest.ps1" `
            -MsiPath $msiPath `
            -InstallDir $installDir `
            -SourceSha $env:LOOP_SOURCE_SHA `
            -SkipEditorLaunch


      - name: Upload Windows package boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: loop-package-boundary-windows-evidence
          path: ${{ runner.temp }}\loop-package-boundary-windows
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create MSIX Package
        run: |
          MakeAppx pack /d ".\loop\build\install\usr\bin" /p ".\loop\build\install\mberrys.Loop-pdf_${{ env.loop_version }}.msix"

      - name: Upload ZIP directory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: 'Loop-pdf-Windows-${{ env.loop_version }}.zip'
          path: .\loop\build\install\usr\bin
          retention-days: 30

      - name: Upload MSIX package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: 'mberrys.Loop-pdf_${{ env.loop_version }}.msix'
          path: .\loop\build\install\mberrys.Loop-pdf_${{ env.loop_version }}.msix
          retention-days: 30
          compression-level: 0

      - name: Upload MSI package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: '${{ env.msipackagefilename }}'
          path: .\loop\build\install\${{ env.msipackagefilename }}
          retention-days: 30
          compression-level: 0
