name: Linux_Flatpak

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  build_ubuntu:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Verify supply-chain pins
        run: python3 scripts/ci/check_supply_chain_pins.py

      - name: Verify AppStream Version
        run: |
           appstreamcli --version

      - name: Setup Flatpak
        run: |
          # Versions pinned to the ubuntu-24.04 image (see
          # .github/pins/packaging-tools.json -> flatpak). The runner label is
          # pinned too, so apt does not drift to an arbitrary future version.
          . <(python3 - <<'PY'
          import json
          with open(".github/pins/packaging-tools.json", encoding="utf-8") as f:
              pins = json.load(f)["flatpak"]
          print(f"export FLATPAK_VERSION={pins['flatpakVersion']}")
          print(f"export FLATPAK_BUILDER_VERSION={pins['flatpakBuilderVersion']}")
          PY
          )

          sudo apt update
          sudo apt install -y "flatpak=$FLATPAK_VERSION" "flatpak-builder=$FLATPAK_BUILDER_VERSION"

          # Fail the build if apt substituted a different version.
          test "$(dpkg-query -W -f='${Version}' flatpak)" = "$FLATPAK_VERSION" || { echo "::error::flatpak version mismatch"; exit 1; }
          test "$(dpkg-query -W -f='${Version}' flatpak-builder)" = "$FLATPAK_BUILDER_VERSION" || { echo "::error::flatpak-builder version mismatch"; exit 1; }
          flatpak --version
          flatpak-builder --version

      - name: Add Flatpak repository
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install KDE SDK and Runtime
        run: |
          sudo flatpak install -y flathub org.kde.Sdk/x86_64/6.9 org.kde.Platform/x86_64/6.9

      - name: List Flatpak Installed Packages and Version
        run: |
          flatpak --version
          flatpak list

      - name: Cache Flatpak builder artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cache/flatpak-builder
            ~/.var/cache/flatpak-builder
          key: ${{ runner.os }}-flatpak-${{ hashFiles('Flatpak/*.json') }}
          restore-keys: |
            ${{ runner.os }}-flatpak-

      - name: Inject Git commit hash into Flatpak manifest
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "Current commit hash: $COMMIT_HASH"
          sed -i "s/LOUPE_LAST_COMMIT/$COMMIT_HASH/g" ./Flatpak/io.github.mberrys.Loupe-pdf.json

      - name: Build Flatpak
        run: |
          flatpak-builder --repo=repo --sandbox --force-clean  build-dir ./Flatpak/io.github.mberrys.Loupe-pdf.json

      - name: Build Flatpak Package
        run: |
          flatpak build-bundle repo io.github.mberrys.Loupe-pdf.flatpak io.github.mberrys.Loupe-pdf

      - name: Upload Flatpak Package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: io.github.mberrys.Loupe-pdf.flatpak
          path: ./io.github.mberrys.Loupe-pdf.flatpak
          retention-days: 30
          compression-level: 0
