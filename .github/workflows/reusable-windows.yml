name: Reusable Windows CI

on:
  workflow_call:
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\loupe\vcpkg\overlays\general
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      QT_QPA_PLATFORM: offscreen
      SENTRY_DSN: off

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: loupe

      - name: Exclude workspace from Windows Defender real-time scanning
        # CMake's install() does an atomic rename of freshly-built DLLs; Defender's
        # real-time scanner can hold a brief lock on them right after MSBuild writes
        # them, which surfaces as CMake's misleading "file INSTALL cannot find X:
        # File exists" error. Best-effort: some runner policies don't allow this, so
        # don't fail the build over it.
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${env:GITHUB_WORKSPACE}" -ErrorAction SilentlyContinue

      - name: Verify supply-chain pins
        working-directory: loupe
        shell: pwsh
        run: |
          python scripts\ci\check_supply_chain_pins.py

      - name: Verify Loupe shell contract
        working-directory: loupe
        shell: pwsh
        run: .\scripts\verify-loupe-shell-contract.ps1
      - name: Verify installed product graph
        working-directory: loupe
        shell: pwsh
        run: python scripts/verify-installed-product-graph.py
      - name: Verify interaction boundary
        working-directory: loupe
        shell: pwsh
        run: |
          python scripts\verify-interaction-boundary.py
      - name: Verify command catalog
        working-directory: loupe
        shell: pwsh
        run: |
          python scripts\verify-command-catalog.py
      - name: Verify Quick shell admission policy
        working-directory: loupe
        shell: pwsh
        run: python scripts\verify-quick-shell-policy.py
      - name: Verify Quick runtime/package contract
        working-directory: loupe
        shell: pwsh
        run: python scripts\verify-quick-runtime-contract.py
      - name: Verify branch policy
        working-directory: loupe
        shell: pwsh
        run: |
          python scripts\ci\check_branch_policy.py
      - name: Verify version policy
        working-directory: loupe
        shell: pwsh
        run: |
          python scripts\ci\check_version_policy.py
      - name: Verify resource-envelope contracts
        working-directory: loupe
        shell: pwsh
        run: |
          python -m unittest scripts.resource_envelope.test_validate_envelope scripts.resource_envelope.test_pathological_workload -v
          python scripts/resource_envelope/validate_envelope.py docs/generated/huge-document-envelope.json
          python scripts/resource_envelope/pathological_workload.py `
            --output "$env:RUNNER_TEMP\loupe-pathological-vector.pdf" `
            --page-count 256 --operations 256 --family pathological-vector

      - name: Prepare vcpkg directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: 'VCPKG: Set up VCPKG'
        shell: pwsh
        run: |
          $configPath = Join-Path $env:GITHUB_WORKSPACE "loupe\vcpkg-configuration.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $vcpkgCommit = $config.'default-registry'.baseline

          if ($vcpkgCommit -notmatch '^[0-9a-f]{40}$') {
              throw "Invalid vcpkg baseline: $vcpkgCommit"
          }

          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout --detach $vcpkgCommit

          $actual = (git -C vcpkg rev-parse HEAD).Trim()
          if ($actual -ne $vcpkgCommit) {
              throw "vcpkg checkout $actual does not match manifest baseline $vcpkgCommit"
          }

          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg\vcpkg.exe integrate install

      - name: 'VCPKG: Cache vcpkg dependencies'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ./vcpkg/downloads
            ./vcpkg/packages
            ./vcpkg/installed
            ./vcpkg/archives
          key: ${{ runner.os }}-vcpkg-v2-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v2-

      - name: 'VCPKG: Install project dependencies'
        run: |
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE 'loupe'
          .\vcpkg.exe install --triplet x64-windows --x-manifest-root=$manifestRoot --x-install-root=$env:VCPKG_INSTALLED_DIR --clean-buildtrees-after-build --clean-packages-after-build
        working-directory: vcpkg

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: '6.11.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          modules: 'qtspeech qtmultimedia'
          cache: 'true'
          cache-key-prefix: ${{ runner.os }}-qt-6111
          # aqtinstall 3.3.0 cannot resolve Qt 6.11+ Windows repo layout (miurahr/aqtinstall#1007).
          # Pin PR #1000 merge until aqtinstall >3.3.0 ships with that fix.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b

      - name: Prepare Widgets-absent Qt prefix
        working-directory: loupe
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:QT_ROOT_DIR)) {
            throw "install-qt-action did not provide QT_ROOT_DIR"
          }
          $destination = Join-Path $env:RUNNER_TEMP "loupe-qt-without-widgets"
          $manifest = Join-Path $env:RUNNER_TEMP "loupe-widgets-free-qt.json"
          python scripts\ci\prepare_widgets_free_qt.py `
            --source $env:QT_ROOT_DIR `
            --destination $destination `
            --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw "Widgets-free Qt preparation failed with exit code $LASTEXITCODE" }
          "LOUPE_WIDGETS_FREE_QT_PREFIX=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOUPE_WIDGETS_FREE_BUILD_DIR=$(Join-Path $env:RUNNER_TEMP 'loupe-widgets-free-build')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOUPE_WIDGETS_FREE_NEGATIVE_BUILD_DIR=$(Join-Path $env:RUNNER_TEMP 'loupe-widgets-free-negative')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Widgets-absent release configure
        working-directory: loupe
        shell: pwsh
        run: |
          python scripts\verify-widgets-free-release-profile.py `
            --qt-prefix $env:LOUPE_WIDGETS_FREE_QT_PREFIX `
            --configure `
            --build-dir $env:LOUPE_WIDGETS_FREE_BUILD_DIR `
            -- `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_VCPKG_BUILD_TYPE=Release `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR" `
            -DLOUPE_BUILD_QUICK_SHELL_SMOKE=ON `
            -DLOUPE_BUILD_QUICK_CANVAS=ON `
            -DLOUPE_BUILD_PRODUCT_QUICK_A11Y_SMOKE=ON `
            -DLOUPE_BUILD_CANVAS_BENCHMARK=OFF `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          if ($LASTEXITCODE -ne 0) { throw "Widgets-absent release configure failed with exit code $LASTEXITCODE" }

      - name: Verify Widgets-bound target fails closed
        working-directory: loupe
        shell: pwsh
        run: |
          python scripts\verify-widgets-free-release-profile.py `
            --qt-prefix $env:LOUPE_WIDGETS_FREE_QT_PREFIX `
            --configure `
            --expect-configure-failure `
            --build-dir $env:LOUPE_WIDGETS_FREE_NEGATIVE_BUILD_DIR `
            -- `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_VCPKG_BUILD_TYPE=Release `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR" `
            -DLOUPE_BUILD_CODE_GENERATOR=ON
          if ($LASTEXITCODE -ne 0) { throw "Widgets-bound configure did not fail closed as expected" }

      - name: Build Widgets-absent release profile
        working-directory: loupe
        shell: pwsh
        run: |
          cmake --build $env:LOUPE_WIDGETS_FREE_BUILD_DIR --target ALL_BUILD release_translations --config Release -j6
          if ($LASTEXITCODE -ne 0) { throw "Widgets-absent release build failed with exit code $LASTEXITCODE" }

      - name: Smoke Widgets-absent Qt Quick backends
        working-directory: loupe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          .\scripts\run-quick-backend-smoke.ps1 -BuildDir $env:LOUPE_WIDGETS_FREE_BUILD_DIR -Mode native -ExpectedGraphicsApi d3d11
          .\scripts\run-quick-backend-smoke.ps1 -BuildDir $env:LOUPE_WIDGETS_FREE_BUILD_DIR -Mode software -ExpectedGraphicsApi software

      - name: Smoke Widgets-absent product accessibility
        working-directory: loupe
        shell: pwsh
        run: |
          .\scripts\run-product-quick-a11y-smoke.ps1 -BuildDir $env:LOUPE_WIDGETS_FREE_BUILD_DIR -Backend native
          .\scripts\run-product-quick-a11y-smoke.ps1 -BuildDir $env:LOUPE_WIDGETS_FREE_BUILD_DIR -Backend software

      - name: Test Widgets-absent release profile
        shell: pwsh
        run: |
          ctest --test-dir $env:LOUPE_WIDGETS_FREE_BUILD_DIR -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Widgets-absent release tests failed with exit code $LASTEXITCODE" }

      - name: Record Windows Widgets-free release evidence
        working-directory: loupe
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "loupe-widgets-free-release-evidence.json"
          $manifest = Join-Path $env:RUNNER_TEMP "loupe-widgets-free-qt.json"
          python scripts\ci\record_widgets_free_release_evidence.py `
            --root . `
            --qt-prefix $env:LOUPE_WIDGETS_FREE_QT_PREFIX `
            --manifest $manifest `
            --build-dir $env:LOUPE_WIDGETS_FREE_BUILD_DIR `
            --platform windows `
            --qt-version 6.11.1 `
            --build-status passed `
            --test-status passed `
            --negative-configure-status passed `
            --output $evidence
          if ($LASTEXITCODE -ne 0) { throw "Widgets-free evidence recording failed with exit code $LASTEXITCODE" }

      - name: Upload Windows Widgets-free release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: loupe-widgets-free-windows-evidence
          path: |
            ${{ runner.temp }}\loupe-widgets-free-qt.json
            ${{ runner.temp }}\loupe-widgets-free-release-evidence.json
            ${{ runner.temp }}\loupe-widgets-free-build\CMakeCache.txt
          if-no-files-found: error

      - name: Build project
        working-directory: loupe
        shell: pwsh
        run: |
          # pwsh, unlike bash's default -e, does not stop on a non-zero exit code from
          # an external command (cmake here) -- it just keeps going to the next line.
          # That previously let a real "cmake --build" link failure fall through
          # silently into "cmake --install" failing on a DLL that was never produced,
          # which read like a Windows install race instead of the build error it was.
          # Check $LASTEXITCODE after each cmake invocation so a real failure stops
          # the step immediately, at the command that actually failed.
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_VCPKG_BUILD_TYPE=Release -DLOUPE_LOUPE_DISTRIBUTION=OFF -DLOUPE_BUILD_QUICK_SHELL_SMOKE=ON -DLOUPE_BUILD_CANVAS_BENCHMARK=ON -DLOUPE_BUILD_QUICK_CANVAS=ON -DLOUPE_BUILD_PRODUCT_QUICK_A11Y_SMOKE=ON -DLOUPE_INSTALL_QT_DEPENDENCIES=ON -DLOUPE_INSTALL_DEPENDENCIES=ON -DCMAKE_TOOLCHAIN_FILE="${env:GITHUB_WORKSPACE}\vcpkg\scripts\buildsystems\vcpkg.cmake" -DLOUPE_QT_ROOT="${env:QT_ROOT_DIR}" -DLOUPE_INSTALL_MSVC_REDISTRIBUTABLE=ON -DLOUPE_INSTALL_PREPARE_WIX_INSTALLER=ON -DLOUPE_INSTALL_TO_USR=ON
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed with exit code $LASTEXITCODE." }

          cmake --build build --target release_translations --config Release -j6
          if ($LASTEXITCODE -ne 0) { throw "cmake --build (release_translations) failed with exit code $LASTEXITCODE." }

          cmake --build build --config Release -j6
          if ($LASTEXITCODE -ne 0) { throw "cmake --build failed with exit code $LASTEXITCODE." }

          # Kept as defense-in-depth against genuine Windows install-time file-lock
          # flakiness (antivirus/indexer), now that a real build failure can no longer
          # hide behind it.
          $installSucceeded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
              cmake --install build --config Release
              if ($LASTEXITCODE -eq 0) {
                  $installSucceeded = $true
                  break
              }
              Write-Host "cmake --install attempt $attempt failed with exit code $LASTEXITCODE; retrying after a short delay."
              Start-Sleep -Seconds (5 * $attempt)
          }
          if (-not $installSucceeded) {
              throw "cmake --install failed after 3 attempts."
          }

      - name: Smoke Qt Quick preferred backend
        working-directory: loupe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: .\scripts\run-quick-backend-smoke.ps1 -BuildDir .\build -Mode native -ExpectedGraphicsApi d3d11

      - name: Smoke Qt Quick software backend
        working-directory: loupe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: .\scripts\run-quick-backend-smoke.ps1 -BuildDir .\build -Mode software -ExpectedGraphicsApi software

      # ADR-009's CI admission scope gates on widget-baseline (comparison
      # baseline) and quick-item (the corrected S21 target); qquickwidget and
      # window-container are diagnostic-only per the amendment and are run
      # separately, non-blocking, since window-container's focus proxying is
      # known not to work under a headless offscreen platform (confirmed on
      # Linux CI; kept non-blocking here too for a uniform admission gate).
      - name: Run S21 canvas benchmark (native, required candidates)
        working-directory: loupe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          .\scripts\run-canvas-benchmark.ps1 -BuildDir .\build -Candidate widget-baseline
          .\scripts\run-canvas-benchmark.ps1 -BuildDir .\build -Candidate quick-item

      - name: Run S21 canvas benchmark (software, required candidates)
        working-directory: loupe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QT_QUICK_BACKEND: software
        run: |
          .\scripts\run-canvas-benchmark.ps1 -BuildDir .\build -Candidate widget-baseline
          .\scripts\run-canvas-benchmark.ps1 -BuildDir .\build -Candidate quick-item

      - name: Run S21 canvas benchmark (full diagnostic, non-blocking)
        continue-on-error: true
        working-directory: loupe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: .\scripts\run-canvas-benchmark.ps1 -BuildDir .\build -Candidate all

      - name: Run QWidget/Quick focus bridge (native)
        working-directory: loupe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: .\scripts\run-quick-focus-bridge.ps1 -BuildDir .\build -Mode native

      - name: Run QWidget/Quick focus bridge (software)
        working-directory: loupe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: .\scripts\run-quick-focus-bridge.ps1 -BuildDir .\build -Mode software

      - name: Run product Quick accessibility smoke (native)
        working-directory: loupe
        shell: pwsh
        run: .\scripts\run-product-quick-a11y-smoke.ps1 -Backend native

      - name: Run product Quick accessibility smoke (software)
        working-directory: loupe
        shell: pwsh
        run: .\scripts\run-product-quick-a11y-smoke.ps1 -Backend software

      - name: Verify developer product surface
        working-directory: loupe
        shell: pwsh
        run: .\scripts\verify-loupe-surface.ps1 -InstallDir "${env:GITHUB_WORKSPACE}\loupe\build\install\usr\bin" -Profile developer -BuildDir .\build -InstallManifestPath .\build\install_manifest.txt

      - name: Run unit tests
        working-directory: loupe/build
        shell: pwsh
        run: |
          ctest -C Release --output-on-failure

      - name: Run preflight corpus gate
        working-directory: loupe/build
        shell: pwsh
        run: |
          ctest -C Release -R UnitTestsPreflightCorpus --output-on-failure

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: 'loupe-${{ runner.os }}.zip'
          path: .\loupe\build\install\usr\bin
          retention-days: 30

      - name: Upload Sentry debug files
        # Do not use `if: secrets.*` — GitHub rejects the secrets context in
        # conditionals and the workflow file fails to parse. The script no-ops
        # when SENTRY_AUTH_TOKEN is unset (fork pull requests).
        working-directory: loupe
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_ORG: berry-studios
          SENTRY_PROJECT: loupe-pdf
          SENTRY_URL: https://de.sentry.io
        run: |
          .\scripts\ci\upload_sentry_debug_files.ps1 -BuildDir "${env:GITHUB_WORKSPACE}\loupe\build"
